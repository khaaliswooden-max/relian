<style>
/* ============================================================
   RELIAN BUILD ATLAS
   Palette: Visionblox brand — ink navy, paper, seal teal,
   signal amber, slate. Amber is reserved for one thing only:
   the position flag.
   Type: IBM Plex superfamily — Sans (structure), Mono (every
   measured value), Serif (the state record). Mono is semantic
   here: if it is set in mono, a process produced it.
   ============================================================ */

:root {
  --paper:        #F5F5F0;
  --surface:      #FFFFFF;
  --surface-2:    #ECEDE6;
  --sunk:         #E3E5DD;
  --ink:          #141B31;
  --ink-2:        #3D4763;
  --ink-3:        #6C7794;
  --rule:         #D2D5CA;
  --rule-strong:  #B4B9AC;

  --seal:         #1E8672;
  --seal-soft:    #E0F0EB;
  --seal-line:    #9FCFC2;
  --signal:       #C08A00;
  --signal-pure:  #F7B801;
  --signal-soft:  #FBF0D2;
  --slate:        #8892A4;
  --brick:        #A8462F;
  --brick-soft:   #F6E4DE;

  --shadow:       0 1px 2px rgba(20,27,49,.06), 0 8px 24px -14px rgba(20,27,49,.28);
  --shadow-lift:  0 2px 4px rgba(20,27,49,.08), 0 18px 44px -20px rgba(20,27,49,.40);

  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;

  --measure: 66ch;
  --gutter: clamp(20px, 4vw, 56px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:       #0C1122;
    --surface:     #141B31;
    --surface-2:   #1B2440;
    --sunk:        #0A0F1E;
    --ink:         #EDEFF5;
    --ink-2:       #B6BECF;
    --ink-3:       #8892A4;
    --rule:        #2A3350;
    --rule-strong: #3C476A;

    --seal:        #45C4AA;
    --seal-soft:   #10312C;
    --seal-line:   #2C6B5F;
    --signal:      #F7B801;
    --signal-pure: #F7B801;
    --signal-soft: #33270A;
    --slate:       #7C869B;
    --brick:       #E08066;
    --brick-soft:  #34160F;

    --shadow:      0 1px 2px rgba(0,0,0,.5), 0 10px 30px -16px rgba(0,0,0,.8);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.55), 0 22px 54px -22px rgba(0,0,0,.9);
  }
}

:root[data-theme="dark"] {
  --paper:       #0C1122;
  --surface:     #141B31;
  --surface-2:   #1B2440;
  --sunk:        #0A0F1E;
  --ink:         #EDEFF5;
  --ink-2:       #B6BECF;
  --ink-3:       #8892A4;
  --rule:        #2A3350;
  --rule-strong: #3C476A;

  --seal:        #45C4AA;
  --seal-soft:   #10312C;
  --seal-line:   #2C6B5F;
  --signal:      #F7B801;
  --signal-pure: #F7B801;
  --signal-soft: #33270A;
  --slate:       #7C869B;
  --brick:       #E08066;
  --brick-soft:  #34160F;

  --shadow:      0 1px 2px rgba(0,0,0,.5), 0 10px 30px -16px rgba(0,0,0,.8);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.55), 0 22px 54px -22px rgba(0,0,0,.9);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter); }
.narrow { max-width: var(--measure); }

h1, h2, h3, h4 { text-wrap: balance; line-height: 1.15; margin: 0; font-weight: 600; letter-spacing: -0.015em; }
p { margin: 0; }

/* --- shared atoms ------------------------------------------------ */

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  color: var(--seal);
  white-space: nowrap;
}
.num-null { font-family: var(--mono); color: var(--slate); font-style: normal; white-space: nowrap; }
code, .mono { font-family: var(--mono); font-size: .88em; }

.chip {
  display: inline-flex; align-items: center; gap: .45em;
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  padding: .32em .62em; border-radius: 3px;
  border: 1px solid transparent; white-space: nowrap;
}
.chip-measured { color: var(--seal); background: var(--seal-soft); border-color: var(--seal-line); }
.chip-sealed   { color: var(--seal); background: transparent; border-color: var(--seal-line); }
.chip-here     { color: #3A2A00; background: var(--signal-pure); border-color: var(--signal-pure); font-weight: 600; }
.chip-none     { color: var(--slate); background: transparent; border-color: var(--rule-strong); }
.chip-refuse   { color: var(--brick); background: var(--brick-soft); border-color: var(--brick); }

hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }

/* --- masthead ---------------------------------------------------- */

.masthead {
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  padding: clamp(36px, 6vw, 72px) 0 0;
}
.mast-top { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: baseline; justify-content: space-between; }
.mast-title { font-size: clamp(34px, 5.6vw, 60px); letter-spacing: -0.03em; font-weight: 700; }
.mast-title em { font-style: normal; color: var(--seal); }
.mast-sub {
  font-family: var(--serif); font-size: clamp(16px, 1.7vw, 19px);
  color: var(--ink-2); max-width: 60ch; margin-top: 14px;
}
.mast-warn {
  margin-top: 26px; padding: 12px 16px;
  border-left: 3px solid var(--brick);
  background: var(--brick-soft);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.55; color: var(--ink);
}

.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin-top: 36px; border-top: 1px solid var(--rule); }
.readout > div { padding: 18px 20px 20px 0; border-right: 1px solid var(--rule); }
.readout > div:last-child { border-right: 0; }
.readout dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.readout dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: clamp(20px, 2.4vw, 26px); font-weight: 500; color: var(--ink); letter-spacing: -0.02em; }
.readout dd.is-seal { color: var(--seal); }
.readout dd.is-zero { color: var(--slate); }
.readout dd small { display: block; font-family: var(--sans); font-size: 11.5px; font-weight: 400; letter-spacing: 0; color: var(--ink-3); margin-top: 5px; line-height: 1.4; }

/* --- plates ------------------------------------------------------ */

.plate { padding: clamp(56px, 8vw, 104px) 0; border-bottom: 1px solid var(--rule); }
.plate:nth-of-type(even) { background: var(--surface); }
.plate-head { display: flex; gap: clamp(16px, 3vw, 40px); align-items: flex-start; margin-bottom: clamp(32px, 4vw, 52px); }
.plate-numeral {
  font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .14em;
  color: var(--seal); border: 1px solid var(--seal-line); border-radius: 3px;
  padding: .4em .6em; flex: none; margin-top: 6px;
}
.plate-title { font-size: clamp(24px, 3.4vw, 36px); letter-spacing: -0.025em; }
.plate-lede { font-family: var(--serif); font-size: clamp(15.5px, 1.6vw, 18px); color: var(--ink-2); max-width: var(--measure); margin-top: 12px; }

figure { margin: 0; }
figure svg { display: block; width: 100%; height: auto; }
.figframe {
  background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px;
  padding: clamp(14px, 2.4vw, 30px); overflow-x: auto;
}
.plate:nth-of-type(even) .figframe { background: var(--sunk); }
figcaption { font-family: var(--serif); font-size: 14.5px; color: var(--ink-2); margin-top: 16px; max-width: var(--measure); }
figcaption b { font-family: var(--sans); font-weight: 600; color: var(--ink); }

/* --- the rail and the flag --------------------------------------- */

.rail-scroll { overflow-x: auto; padding: 88px 0 8px; margin: 0 calc(var(--gutter) * -1); padding-left: var(--gutter); padding-right: var(--gutter); }
.rail {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(148px, 1fr);
  min-width: 940px; position: relative;
}
.rail::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--rule-strong);
}

.stop { position: relative; padding: 0 10px 0 0; }
.stop-btn {
  appearance: none; -webkit-appearance: none;
  display: block; width: 100%; text-align: left;
  background: none; border: 0; padding: 22px 8px 16px 0;
  cursor: pointer; color: inherit; font: inherit;
  border-top: 2px solid transparent; margin-top: -2px;
  transition: border-color .28s ease, opacity .28s ease;
}
.stop-btn:focus-visible { outline: 2px solid var(--seal); outline-offset: 3px; border-radius: 3px; }

.stop-dot {
  position: absolute; top: -6px; left: 0; width: 11px; height: 11px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--rule-strong);
  transition: background .28s ease, border-color .28s ease, transform .28s ease;
}
.plate:nth-of-type(even) .stop-dot { background: var(--surface); }

.stop-id { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--ink-3); display: block; }
.stop-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; margin-top: 7px; display: block; letter-spacing: -0.01em; }
.stop-when { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 6px; display: block; font-variant-numeric: tabular-nums; }

/* state: done */
.stop[data-state="done"] .stop-dot { background: var(--seal); border-color: var(--seal); }
.stop[data-state="done"] .stop-btn { border-top-color: var(--seal); }

/* state: current — the one place amber is spent */
.stop[data-state="current"] .stop-dot { background: var(--signal-pure); border-color: var(--signal-pure); transform: scale(1.35); }
.stop[data-state="current"] .stop-btn { border-top-color: var(--signal-pure); }
.stop[data-state="current"] .stop-name { color: var(--ink); }

/* state: future */
.stop[data-state="future"] .stop-btn { opacity: .5; }
.stop[data-state="future"] .stop-name { font-weight: 500; }

.stop-btn:hover .stop-name { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* the flag itself */
.flag {
  position: absolute; left: -3px; bottom: calc(100% + 4px);
  width: 74px; pointer-events: none;
  opacity: 0; transform: translateY(10px) scale(.9); transform-origin: 4px 100%;
  transition: opacity .34s ease, transform .34s cubic-bezier(.2,1.5,.4,1);
}
.stop[data-state="current"] .flag { opacity: 1; transform: translateY(0) scale(1); }
.flag-here {
  font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .14em;
  fill: var(--ink);
}
@media (prefers-reduced-motion: reduce) {
  .flag, .stop-dot, .stop-btn { transition: none; }
}

/* phase bands under the rail */
.bands { display: grid; grid-auto-flow: column; min-width: 940px; margin-top: 4px; }
.band { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  border-top: 1px solid var(--rule); padding: 8px 10px 0 0; }
.band span { display: block; border-left: 2px solid var(--rule-strong); padding-left: 8px; }
.band[data-done="true"] span { border-left-color: var(--seal); color: var(--seal); }

/* --- state panel -------------------------------------------------- */

.panel-zone { margin-top: clamp(28px, 4vw, 44px); }
.panel {
  display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: clamp(24px, 4vw, 52px);
  border: 1px solid var(--rule); border-top: 3px solid var(--seal);
  border-radius: 6px; background: var(--surface); box-shadow: var(--shadow);
  padding: clamp(22px, 3.2vw, 38px);
}
.plate:nth-of-type(even) .panel { background: var(--sunk); }
.panel[data-status="here"]  { border-top-color: var(--signal-pure); }
.panel[data-status="none"]  { border-top-color: var(--rule-strong); }
.panel[hidden] { display: none; }

.panel-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.panel h3 { font-size: clamp(20px, 2.6vw, 27px); letter-spacing: -0.025em; }
.panel-body { font-family: var(--serif); font-size: 16.5px; line-height: 1.68; color: var(--ink-2); margin-top: 16px; display: grid; gap: 14px; max-width: 62ch; }
.panel-body strong { font-family: var(--sans); font-weight: 600; color: var(--ink); }
.panel-body em { font-style: italic; }

.panel-side { display: grid; gap: 18px; align-content: start; }
.side-block { border-left: 2px solid var(--rule); padding-left: 14px; }
.side-block.is-seal { border-left-color: var(--seal-line); }
.side-block.is-none { border-left-color: var(--rule-strong); }
.side-block h4 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.side-block ul { margin: 9px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.side-block li { font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
.side-block li::before { content: "—"; color: var(--rule-strong); margin-right: .5em; font-family: var(--mono); }

.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 22px; }
.controls p { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
.btn {
  appearance: none; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  padding: .62em 1em; border-radius: 3px; border: 1px solid var(--rule-strong);
  background: transparent; color: var(--ink-2); cursor: pointer;
  transition: border-color .18s ease, color .18s ease, background .18s ease;
}
.btn:hover { border-color: var(--seal); color: var(--seal); }
.btn:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.btn[data-role="save"] { border-color: var(--signal-pure); color: var(--signal); }
.btn[data-role="save"]:hover { background: var(--signal-soft); }
.btn[hidden] { display: none; }
.save-note { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* --- provenance table --------------------------------------------- */

.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.plate:nth-of-type(even) .tablewrap { background: var(--sunk); }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
caption { text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding: 0 0 12px; }
th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--rule); vertical-align: top; font-size: 13.5px; line-height: 1.5; }
thead th { font-family: var(--mono); font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; background: var(--surface-2); }
.plate:nth-of-type(even) thead th { background: var(--surface); }
tbody tr:last-child td { border-bottom: 0; }
td.v { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
td.src { color: var(--ink-3); font-size: 12.5px; }
td.src code { font-size: 11.5px; }

.grade { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; padding: .25em .5em; border-radius: 2px; border: 1px solid; white-space: nowrap; }
.g-verified { color: var(--seal); border-color: var(--seal-line); }
.g-plausible { color: var(--signal); border-color: var(--signal); }
.g-none { color: var(--slate); border-color: var(--rule-strong); }

/* --- footer ------------------------------------------------------- */

footer { padding: clamp(40px, 6vw, 72px) 0; }
.foot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 28px; }
.foot-grid h4 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin-bottom: 10px; }
.foot-grid p, .foot-grid li { font-size: 13px; line-height: 1.6; color: var(--ink-2); }
.foot-grid ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.colophon { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 11px; color: var(--ink-3); line-height: 1.7; }

@media (max-width: 900px) {
  .panel { grid-template-columns: 1fr; }
  .readout > div { border-right: 0; border-bottom: 1px solid var(--rule); padding-right: 0; }
  .plate-head { flex-direction: column; gap: 14px; }
}
</style>

<style>
/* diagram vocabulary — shared by all three plates */
.d-box       { fill: var(--surface); stroke: var(--rule-strong); stroke-width: 1; }
.plate:nth-of-type(even) .d-box { fill: var(--surface); }
.d-sunk      { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; }
.plate:nth-of-type(even) .d-sunk { fill: var(--surface-2); }
.d-seal      { fill: var(--seal-soft); stroke: var(--seal); stroke-width: 1.25; }
.d-brick     { fill: var(--brick-soft); stroke: var(--brick); stroke-width: 1.25; }
.d-zone      { fill: none; stroke: var(--seal); stroke-width: 1.25; stroke-dasharray: 7 5; }
.d-zone-q    { fill: none; stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 3 4; }
.d-t         { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.d-t-sm      { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 600; }
.d-s         { fill: var(--ink-3); font-family: var(--mono); font-size: 10.5px; }
.d-s2        { fill: var(--ink-2); font-family: var(--sans); font-size: 11.5px; }
.d-zonelab   { fill: var(--seal); font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .13em; }
.d-mutelab   { fill: var(--ink-3); font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .13em; }
.d-bricklab  { fill: var(--brick); font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .13em; }
.d-num       { fill: var(--seal); font-family: var(--mono); font-size: 11px; font-weight: 500; }
.d-line      { stroke: var(--rule-strong); stroke-width: 1.5; fill: none; }
.d-line-seal { stroke: var(--seal); stroke-width: 1.5; fill: none; }
.d-line-dash { stroke: var(--rule-strong); stroke-width: 1.25; fill: none; stroke-dasharray: 4 4; }
.d-alab      { fill: var(--ink-2); font-family: var(--mono); font-size: 10px; }
.d-head      { fill: var(--rule-strong); }
.d-head-seal { fill: var(--seal); }
</style>

<style>
/* ---- site chrome: the two-tab shell shared by both pages ---- */
.tabs {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.tabs-inner { display: flex; align-items: center; gap: clamp(14px, 3vw, 34px); min-height: 52px; flex-wrap: wrap; }
.tabs-brand { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; color: var(--ink); flex: none; }
.tabs-brand span { color: var(--seal); font-weight: 500; }
.tabs-links { display: flex; gap: 4px; flex: 1 1 auto; }
.tab {
  font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .11em; text-transform: uppercase;
  color: var(--ink-3); text-decoration: none; padding: 16px 12px 15px;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .18s ease, border-color .18s ease;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--seal); border-bottom-color: var(--seal); }
.tab:focus-visible { outline: 2px solid var(--seal); outline-offset: -4px; border-radius: 2px; }
.tabs-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: .06em; flex: none; }

/* ---- the rendered technical summary ---- */
.md { padding: clamp(40px, 6vw, 80px) 0 clamp(56px, 8vw, 96px); }
.md-body { max-width: 78ch; }
.md-body > h1 {
  font-size: clamp(30px, 4.6vw, 46px); letter-spacing: -0.03em; font-weight: 700;
  margin: 0 0 6px; padding-bottom: 0;
}
