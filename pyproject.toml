[project]
name = "relian"
version = "0.1.0"
description = "Universal Legacy Refactoring Substrate"
authors = [{name = "Aldrich Khaalis Wooden, Sr.", email = "akwooden@zuup.io"}]
requires-python = ">=3.11"
# R6 (WP-2.0.-2): `openai`, `anthropic` and `neo4j` were removed from this
# list on 2026-08-20. The first two are generative-AI clients that must not be
# installable inside a customer perimeter; the third was reachable only from
# the deleted src/analysis package. tests/test_no_generative_ai_in_transform_path.py
# fails if any of the three is reintroduced here. See docs/R6_AUDIT_2026-08.md.
#
# WP-2.0.-1 (2026-08-20): four further distributions left this list. `langchain`,
# `transformers` and `torch` were the residual flagged in docs/R6_AUDIT_2026-08.md
# §8 -- an LLM-orchestration framework and two deep-learning runtimes declared as
# hard runtime requirements with ZERO import sites anywhere in src/, transpiler/,
# demo/ or bench/. `pandas` went the same way for the same reason: it had no
# import site either. They cost every on-prem installation several gigabytes and
# a security-review surface, for nothing.
#
# The five developer tools that used to sit here (`pytest`, `pytest-cov`,
# `black`, `pylint`, `mypy`) moved to the `dev` extra below. A customer-perimeter
# install of the transform path has no business pulling a test runner and three
# linters.
#
# WP-2.0.-3 (2026-08-20): `xgboost` left this list. It was the disposition the
# note above deferred. Its only two import sites were `src/ml/risk_scorer.py`
# and `src/intelligence/migration_intelligence.py`, both deleted under R1 --
# the model was retrained every 20 migrations on feature rows containing
# `int(p.cyclomatic_complexity * 1.2)` labelled "cognitive (approx)", three
# hardcoded 0 placeholders, and `p.lines_of_code / max(1, 5)`. A 58 MB wheel
# and a CUDA-adjacent transitive set, carried into every on-prem install, for a
# model trained on fabricated inputs. tests/test_no_fabricated_metrics.py fails
# if it is reintroduced here. See docs/R1_ML_DISPOSITION_2026-08.md.
#
# WP-2.0.1 (2026-08-20): `numpy` left this list -- the residual WP-2.0.-3
# logged UNRESOLVED and deferred to the operator. Its two consumers were
# `src/ml/risk_scorer.py` and `src/intelligence/migration_intelligence.py`,
# both deleted under R1, and it was carried afterwards only because removing it
# was outside that work package's brief. Re-measured before removal rather than
# taken from the earlier note: zero direct import sites repository-wide, and
# zero transitive ones -- regenerating this closure without it drops `numpy`
# from requirements.lock entirely, so nothing in `demo/`, `bench/harness/`,
# `transpiler/` or `src/` was reaching it through another distribution.
# Commands and both pin counts are in docs/PHASE2_LOG.md, WP-2.0.1 §2.
dependencies = [
    "psycopg2-binary>=2.9.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "antlr4-python3-runtime>=4.13.0"
]

[project.optional-dependencies]
# The toolchain CI installs. `pip install -e ".[dev]"` after `pip install -r
# requirements.lock` must be a no-op resolution-wise: every name here is pinned
# in the lock file.
#
# WP-2.0.-3: `jupyter`, `ipython` and `pre-commit` moved out of here into the
# `notebook` extra below. They are authoring tools, not test dependencies --
# `jupyter` alone dragged ~60 transitive distributions (jupyterlab, notebook,
# nbconvert, tornado, pyzmq, the whole stack) through the lock file and into
# every CI run, none of which pytest touches. `dev` is now exactly what the
# gate needs to run and lint the suite.
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "pylint>=3.0.0",
    "mypy>=1.7.0"
]

# Local authoring tools. Deliberately NOT installed by .github/workflows/
# tests.yml, and deliberately NOT part of the `dev` closure that
# requirements.lock pins, so neither CI nor a customer-perimeter install pays
# for them. Install with `pip install -e ".[notebook]"`.
notebook = [
    "ipython>=8.18.0",
    "jupyter>=1.0.0",
    "pre-commit>=3.5.0"
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=html --cov-report=term"
# The suite imports first-party code as `src.assessment.…`, which requires the
# REPO ROOT on sys.path. Nothing was putting it there reliably:
#
#   * `pip install -e .` does not. setuptools auto-detects this project as
#     src-layout and points the editable path at `<repo>/src`, so `assessment`
#     and `core` become importable as TOP-LEVEL names while `src.assessment`
#     does not resolve at all.
#   * `python -m pytest` does, but only as a side effect of `-m` prepending the
#     working directory. Bare `pytest` does not, so the same tree passed one
#     way and died at collection the other -- 9 ImportErrors, zero tests
#     collected, before .github/workflows/tests.yml caught it.
#
# `pythonpath` is rootdir-relative, so it holds for either invocation and from
# any working directory.
pythonpath = ["."]
