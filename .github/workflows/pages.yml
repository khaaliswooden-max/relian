# The published site: https://khaaliswooden-max.github.io/relian/
#
# There is nothing to build. docs/architecture/relian-architecture.html is ONE
# self-contained file -- both tabs, all styles, all scripts inside it -- so this
# job copies it to the Pages artifact root and publishes it. Editing that file
# and pushing to main is the whole update path.
#
# `.nojekyll` is written because without it Pages runs Jekyll over the artifact,
# and Jekyll drops files and directories whose names begin with an underscore.
#
# ONE-TIME SETUP, which cannot be automated from here:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# `pages: write` authorises deploying to a Pages site that already exists;
# creating one is a repository-administration call and GITHUB_TOKEN is not an
# administrator. Until the switch is flipped this job fails with
# `Get Pages site failed. Error: Not Found` -- deliberately, rather than
# skipping, because a deploy job that quietly no-ops is a site that silently
# stops updating.
#
# There is deliberately no `continue-on-error` in this file: a step allowed to
# fail without failing the job is not a gate.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/architecture/relian-architecture.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the artifact
        run: |
          mkdir -p _site
          cp docs/architecture/relian-architecture.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
