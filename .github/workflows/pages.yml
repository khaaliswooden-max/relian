# The published site: https://khaaliswooden-max.github.io/relian/
#
# Two tabs -- the Build Atlas and the Technical Summary -- both generated by
# tools/build_site.py from site/. Nothing here is deployed by hand, and nothing
# here transcribes a number: every figure the pages display is declared in
# site/figures.json with a grade and a basis, and every figure that CAN be
# recomputed from the repository is recomputed on each build. The build fails
# rather than publishing a page that disagrees with the tree it was built from.
#
# Why this job does not also gate the drift check: it already runs. The check
# lives in tests/test_site_build.py, which tests.yml runs on every push to every
# branch. Putting it here as well would mean a branch could go green on the
# suite and only discover the drift at merge, which is the wrong end.
#
# There is deliberately no `continue-on-error` in this file, for the same reason
# tests.yml has none: a step allowed to fail without failing the job is not a
# gate.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the tree, write Pages, mint the OIDC token deploy-pages
# exchanges for its deployment. No `contents: write` -- the site is never
# committed back to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a cancelled Pages
# deployment can leave the site serving a half-published version.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependencies. The builder is standard library only, which is what
      # lets this job stay a three-line build with nothing to pin or audit.
      - name: Build the site
        run: python3 tools/build_site.py --out _site

      # enablement: true turns Pages on for the repository the first time this
      # runs, so the site does not need a manual visit to Settings before its
      # first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
