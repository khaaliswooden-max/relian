# WP-2.0.-1 §5 -- the unit-test gate.
#
# Distinct from bench.yml, which scores the transpiler against the sealed
# held-out corpus. This job runs the ordinary suite against a PINNED
# environment and asserts the result is exactly the sealed triple:
#
#     852 passed, 10 skipped, 0 failed
#
# WP-2.3.2, 2026-08-21: was 848. Net +4 -- review on PR #31 found that
# verify_report.py named a check it did not perform (countersign.py records
# two advisory fields and the verifier compared only one). Never a soundness
# hole: the signature covers the manifest hash, which already commits to the
# instance key. But a verifier that claims a check it skips is the defect this
# package exists to prevent. +2 for the planted-red and the guard that
# generalises it (every advisory field one tool writes, the other must read),
# +2 pinning the dry-run note's published digests the way the delivery sheet's
# already were -- parametrised over both shipped tools, one case each. See
# docs/PHASE2_LOG.md, WP-2.3.2.
#
# WP-2.3.1, 2026-08-21: was 829. Net +19 -- the release key turned out to be
# passphrase-encrypted and its fingerprint was derived from the public key, so
# countersign.py grew a getpass path and a public-only derivation, and both
# grew tests. See docs/PHASE2_LOG.md, WP-2.3.1 §5.
#
# WP-2.3, 2026-08-21: was 702. Net +127, attributed file by file below. See
# docs/PHASE2_LOG.md, WP-2.3 §6.
#
# WP-2.1, 2026-08-20: was 310. Net +60, in two new files: tests/test_seal.py
# (+28) and tests/test_bench_oracle.py (+32), which land RELIAN-DISCOVERY-BENCH
# v0.1 and the sealer that will seal it. See docs/PHASE2_LOG.md, WP-2.1 §6.
#
# WP-2.0.2, 2026-08-20: was 286. Net +24, all of them tests/test_verify_manifest.py,
# which proves each of the three layers of tools/verify_manifest.py fails on its
# own. See docs/PHASE2_LOG.md, WP-2.0.2 §2.
#
# WP-2.0, 2026-08-20: was 285. Net +1 -- the COBOL-85 grammar swap made
# PARTIAL.cbl parse, so the test that pinned it to the token-scan fallback was
# repointed at COPYUSER.cbl, which still cannot parse because COPY needs the
# preprocessor, and a new test pins PARTIAL.cbl's promotion to the tree path.
# See docs/PHASE2_LOG.md, WP-2.0.
#
# WP-2.0.-3, 2026-08-20: was 288. Net -3 -- tests/test_ml.py went with the
# deleted fabricated-metric ML limb (-12) and tests/test_no_fabricated_metrics.py
# arrived to guard it (+9). See docs/R1_ML_DISPOSITION_2026-08.md.
#
# WP-2.0.2, 2026-08-20: the pass count is no longer prose. Both it and the skip
# count are now asserted mechanically against EXPECTED_PASSES / EXPECTED_SKIPS
# below.
#
# The skip count is asserted, not merely reported, and that is the whole point.
# The demo tests skip themselves when GnuCOBOL or the JDK is missing (see
# tests/toolchain.py), which is the honest thing for them to do locally but
# would be green-by-skip here: a runner that quietly lost `cobc` would report
# thirteen more skips, zero failures, and a green tick. Pinning the count turns
# that into a failed build.
#
# There is deliberately no `continue-on-error` in this file. A step that is
# allowed to fail without failing the job is a gate that does not gate.
name: tests

# The trigger, and why it is asymmetric.
#
# This read `push: branches: [main]` until 2026-08-20. That is the wrong way
# round for a gate: it meant the unit-test job could not run on a feature-branch
# push at all, so the only way to see a suite result was to open a pull request
# first -- while bench.yml, on bare `on: [push, pull_request]`, ran the
# expensive held-out scoring on every push to every branch. The cheap gate was
# the restricted one and the costly one was unrestricted. Three consecutive work
# packages (WP-2.0.-3 / PR #24, WP-2.0 / PR #25, and this one) had no suite
# result on the branch until a PR existed.
#
# `push:` is now unrestricted, so the suite runs on every branch as it is pushed.
# `pull_request:` stays scoped to PRs targeting main, which is what the merge
# gate is about; a PR from a branch already covered by the push trigger costs one
# duplicate run, and that is the intended trade.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

