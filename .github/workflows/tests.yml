# WP-2.0.-1 §5 -- the unit-test gate.
#
# Distinct from bench.yml, which scores the transpiler against the sealed
# held-out corpus. This job runs the ordinary suite against a PINNED
# environment and asserts the result is exactly the sealed triple:
#
#     286 passed, 10 skipped, 0 failed
#
# (WP-2.0, 2026-08-20: was 285. Net +1 -- the COBOL-85 grammar swap made
# PARTIAL.cbl parse, so the test that pinned it to the token-scan fallback was
# repointed at COPYUSER.cbl, which still cannot parse because COPY needs the
# preprocessor, and a new test pins PARTIAL.cbl's promotion to the tree path.
# See docs/PHASE2_LOG.md, WP-2.0.
#
# WP-2.0.-3, 2026-08-20: was 288. Net -3 -- tests/test_ml.py went with the
# deleted fabricated-metric ML limb (-12) and tests/test_no_fabricated_metrics.py
# arrived to guard it (+9). See docs/R1_ML_DISPOSITION_2026-08.md.
#
# WP-2.0.2, 2026-08-20: the pass count is no longer prose. Both it and the skip
# count are now asserted mechanically against EXPECTED_PASSES / EXPECTED_SKIPS
# below.)
#
# The skip count is asserted, not merely reported, and that is the whole point.
# The demo tests skip themselves when GnuCOBOL or the JDK is missing (see
# tests/toolchain.py), which is the honest thing for them to do locally but
# would be green-by-skip here: a runner that quietly lost `cobc` would report
# thirteen more skips, zero failures, and a green tick. Pinning the count turns
# that into a failed build.
#
# There is deliberately no `continue-on-error` in this file. A step that is
# allowed to fail without failing the job is a gate that does not gate.
name: tests

# The trigger, and why it is asymmetric.
#
# This read `push: branches: [main]` until 2026-08-20. That is the wrong way
# round for a gate: it meant the unit-test job could not run on a feature-branch
# push at all, so the only way to see a suite result was to open a pull request
# first -- while bench.yml, on bare `on: [push, pull_request]`, ran the
# expensive held-out scoring on every push to every branch. The cheap gate was
# the restricted one and the costly one was unrestricted. Three consecutive work
# packages (WP-2.0.-3 / PR #24, WP-2.0 / PR #25, and this one) had no suite
# result on the branch until a PR existed.
#
# `push:` is now unrestricted, so the suite runs on every branch as it is pushed.
# `pull_request:` stays scoped to PRs targeting main, which is what the merge
# gate is about; a PR from a branch already covered by the push trigger costs one
# duplicate run, and that is the intended trade.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # tests/assessment/test_cross_check.py, all ten conditional on fixture shape.
  # Enumerated and classified in docs/PHASE2_LOG.md §4. Change this number only
  # alongside that section.
  EXPECTED_SKIPS: "10"

  # WP-2.0.2 -- the pass count, which was prose until now.
  #
  # The script below asserted EXPECTED_SKIPS mechanically but only checked that
  # `passed > 0`. That leaves the largest of the three numbers unguarded, and
  # unguarded in the direction that matters: a test which stops being COLLECTED
  # -- a file renamed out of the `python_files` pattern, an ImportError absorbed
  # at collection time, a parametrisation that silently stopped expanding, a
  # module dropped from `testpaths` -- lowers the pass count while the skips
  # stay at 10 and the failures stay at 0. Every assertion in this gate would
  # have been satisfied and the tick would have been green, for a suite that
  # quietly stopped running part of itself.
  #
  # Same discipline as EXPECTED_SKIPS: change this number only alongside
  # docs/PHASE2_LOG.md, and only with the delta attributed test by test.
  #
  # WP-2.0.2 (2026-08-20): deliberately set ONE BELOW the measured 286 for a
  # single commit, to prove on the runner that this assertion actually fires on
  # pass-count drift rather than to argue that it would. Corrected in the
  # commit that follows. See docs/PHASE2_LOG.md, WP-2.0.2 SS1.
  EXPECTED_PASSES: "285"

jobs:
  parser-regen:
    # WP-2.0 -- the committed ANTLR parser under src/parsers/antlr/cobol/ is
    # generated code. Generated code that is committed is only trustworthy if
    # it can be shown to still match the grammar it claims to come from, so
    # this job regenerates it from src/parsers/grammars/Cobol85.g4 with the
    # pinned ANTLR jar and fails the build on any byte difference. It is a
    # separate job from `pytest` on purpose: a stale parser is a provenance
    # failure, and it should be legible as that rather than as a test failure.
    name: parser is byte-identical to its grammar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Pin the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate and diff
        # tools/regen_parser.sh verifies the jar's SHA-256 before running it,
        # so a cached or substituted jar cannot silently change the output.
        run: tools/regen_parser.sh --check

  pytest:
    name: pytest (CPython 3.12, GnuCOBOL + JDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Pin the interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the system toolchain
        # The suite is not pure Python: the demo tests compile COBOL with
        # `cobc` and Java with `javac`, run both, and diff the results. Without
        # both, thirteen demo tests skip and the assertion below fails, which is
        # the intended behaviour -- an unmeasured comparison is not a passed one.
        #
        # Only GnuCOBOL comes from apt. The JDK used to come from
        # `default-jdk-headless`, which is not a version at all: it resolves to
        # whatever the runner image currently calls default, and on
        # ubuntu-latest that was Java 17 while the operator baseline and the dev
        # container were both on 21. The session fixture caught the drift
        # (`javac_version: javac 17.0.20`, recorded in docs/PHASE2_LOG.md §10).
        # A differential-equivalence harness must not take its compiler from a
        # moving image label, so the JDK is pinned by the next step instead.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol

      - name: Pin the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Record the measured toolchain
        # R1/R9: the versions that produced the result, printed into the run log
        # so a green tick is never separable from the conditions that earned it.
        # `java-version: '21'` pins the MAJOR version only -- see the caveat in
        # docs/PHASE2_LOG.md §11 -- so the exact patch release is captured here.
        run: |
          python -VV
          cobc --version | head -1
          javac -version
          java -version

      - name: Install pinned dependencies
        # requirements.lock is fully hashed, so pip refuses any artifact whose
        # SHA-256 is not listed. The editable install that follows adds the
        # project itself; every name in [project.dependencies] and the `dev`
        # extra is already pinned above, so it resolves nothing new.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Record the resolved environment
        run: |
          pip check
          pip freeze | sort > pip-freeze.txt
          echo "pip freeze sha256: $(sha256sum pip-freeze.txt | cut -d' ' -f1)"
          cat pip-freeze.txt

      - name: pytest
        run: pytest -q -rs --junitxml=junit.xml

      - name: Assert the suite result is exactly the sealed triple
        # `if: always()` so a red suite still gets the count breakdown printed
        # rather than only pytest's own summary. It never converts a failure
        # into a pass -- the script exits nonzero on any failure, error, or
        # skip-count drift, and the pytest step above has already failed the
        # job in that case.
        if: always()
        run: |
          python3 - "$EXPECTED_SKIPS" "$EXPECTED_PASSES" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected_skips = int(sys.argv[1])
          expected_passes = int(sys.argv[2])
          report = Path("junit.xml")
          if not report.is_file():
              raise SystemExit(
                  "FAIL: junit.xml was not written -- pytest did not run to "
                  "completion, so there is no result to assert on. An absent "
                  "measurement is not a pass."
              )

          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          if not suites:
              raise SystemExit("FAIL: junit.xml contains no <testsuite> element")

          def total(attr):
              return sum(int(s.get(attr, 0)) for s in suites)

          tests, failures = total("tests"), total("failures")
          errors, skipped = total("errors"), total("skipped")
          passed = tests - failures - errors - skipped

          # The toolchain the run actually measured, recorded by the
          # session-scoped fixture in tests/conftest.py.
          print("--- measured environment ---")
          for suite in suites:
              for prop in suite.iterfind("properties/property"):
                  print(f"  {prop.get('name')}: {prop.get('value')}")

          print("--- result ---")
          print(f"  {passed} passed, {skipped} skipped, "
                f"{failures} failed, {errors} errored")

          problems = []
          if failures or errors:
              problems.append(f"{failures} failure(s) and {errors} error(s); "
                              f"the gate requires 0 of each")
          if skipped != expected_skips:
              print("--- skips in this run ---")
              for suite in suites:
                  for case in suite.iter("testcase"):
                      for skip in case.iterfind("skipped"):
                          print(f"  {case.get('classname')}::{case.get('name')}"
                                f" -- {skip.get('message')}")
              problems.append(
                  f"skip count drifted: {skipped}, expected {expected_skips}. "
                  f"MORE skips usually means the runner lost `cobc` or `javac` "
                  f"and the demo tests guarded themselves off -- that is an "
                  f"unmeasured comparison, not a passing one. FEWER means a "
                  f"conditional skip became unconditional. Either way, "
                  f"reconcile against docs/PHASE2_LOG.md and update "
                  f"EXPECTED_SKIPS in this workflow deliberately."
              )
          if passed != expected_passes:
              problems.append(
                  f"pass count drifted: {passed}, expected {expected_passes}. "
                  f"FEWER passes usually means a test STOPPED BEING COLLECTED "
                  f"-- a renamed file that no longer matches `python_files`, an "
                  f"ImportError absorbed at collection, a parametrisation that "
                  f"stopped expanding -- which lowers this number while leaving "
                  f"skips and failures untouched, and is exactly the drift this "
                  f"assertion exists to catch. MORE passes means tests were "
                  f"added. Either way, reconcile against docs/PHASE2_LOG.md and "
                  f"update EXPECTED_PASSES in this workflow deliberately, "
                  f"attributing the delta test by test."
              )
          if passed <= 0:
              problems.append("no test passed; refusing to certify an empty run")

          if problems:
              for problem in problems:
                  print(f"GATE FAILED: {problem}")
              raise SystemExit(1)

          print(f"GATE MET: {passed} passed (expected {expected_passes}), "
                f"{skipped} skipped (expected {expected_skips}), "
                f"0 failed, 0 errored")
          PY

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: |
            junit.xml
            pip-freeze.txt
          # An earlier step can fail before pytest writes anything; warn rather
          # than masking that failure with a second one here.
          if-no-files-found: warn
