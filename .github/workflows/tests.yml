  # arrived through COPY (FdEntry.record_names is empty in that case, so the
  # row read `record: (unnamed)`). Four of CardDemo's thirteen AGREE rows are
  # COPY-supplied, so a third of the strongest evidence the tool produces could
  # not say what it was about. +1 for the fallback and its direct unit case,
  # +1 for the converse -- a DISAGREE's conflict text must name the record.
  # See docs/PHASE2_LOG.md, WP-2.4a §5.
  #
  # Site build, REVERTED (2026-08-22): 1097 -> 1067. tests/test_site_build.py
  # and tools/build_site.py are removed. The Atlas went back to being one
  # self-contained hand-edited HTML file, which is what was asked for; a
  # generator that derived its figures was scope the request did not carry,
  # and the tests that gave that generator its teeth go with it. Net -30, the
  # exact inverse of the +30 they arrived as. Nothing else changed, and no
  # test outside that one file was touched.
  #
  # Demo discovery track (2026-08-23): 1067 -> 1095. `demo/discovery.py` puts
  # the WP-2.1..2.4 modules -- copybook resolver, layout engine, sealed-oracle
  # cross-check, file inventory, lineage, target-schema DDL and the signed
  # report -- into the walkthrough, which until now showed a Phase 1 product
  # while the build stood at Phase 3. +28 in tests/demo/test_demo_discovery.py.
  # Most of them break something deliberately: a corrupted seal must stop every
  # oracle row from being read, a copybook whose bytes drifted from the sealed
  # corpus must not be compared at all, a perturbed offset must reach the
  # process exit status, and a schema that was generated and never executed
  # must report NOT MEASURED rather than a clean load. One uses
  # `importorskip("psycopg2")`; psycopg2-binary is pinned in requirements.lock
  # and installed by this job, so it does not skip here -- if it ever does,
  # EXPECTED_SKIPS is the gate that will say so.
  EXPECTED_PASSES: "1095"

jobs:
  parser-regen:
    # WP-2.0 -- the committed ANTLR parser under src/parsers/antlr/cobol/ is
    # generated code. Generated code that is committed is only trustworthy if
    # it can be shown to still match the grammar it claims to come from, so
    # this job regenerates it from src/parsers/grammars/Cobol85.g4 with the
    # pinned ANTLR jar and fails the build on any byte difference. It is a
    # separate job from `pytest` on purpose: a stale parser is a provenance
    # failure, and it should be legible as that rather than as a test failure.
    name: parser is byte-identical to its grammar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Pin the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate and diff
        # tools/regen_parser.sh verifies the jar's SHA-256 before running it,
        # so a cached or substituted jar cannot silently change the output.
        run: tools/regen_parser.sh --check

  bench-seal:
    # WP-2.0.2 -- the benchmark tree still matches the manifest that seals it.
    #
    # bench.yml already verifies the Ed25519 signature over the v1.2 ledger.
    # That proves the MANIFEST was not edited. It does not prove the TREE still
    # matches the manifest, and only the second claim catches a silent edit
    # under bench/: change one byte in corpus/P03_eligibility/program.cbl and
    # the signature still verifies perfectly, because it covers the manifest's
    # bytes rather than the corpus's.
    #
    # A separate job for the same reason parser-regen is one: a benchmark whose
    # tree has drifted from its seal is a PROVENANCE failure, and it should be
    # legible as that in the checks list rather than as a test failure. It also
    # means a red suite never suppresses this result, and a drifted tree never
    # suppresses the suite's.
    #
    # tests/test_verify_manifest.py is what proves the verifier has teeth: it
    # copies bench/ into tmp_path, mutates one byte there, and asserts each of
    # the three layers fails on its own. Nothing under bench/ is ever written.
    name: bench tree matches its sealed manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Pin the interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        # The same fully-hashed closure the suite installs. `cryptography` is
        # the verifier's only third-party import and is pinned there; a bare
        # `pip install cryptography` here would be an unpinned artifact in a
        # job whose entire purpose is provenance.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify bench/ against LEDGER_relian-bench-v1.2.json
        # Three layers, each reported independently:
        #   TREE       every recorded file exists and hashes to its recorded
        #              sha256, AND the include set is re-walked so a file
        #              ADDED since sealing is caught too
        #   PAYLOAD    payload_sha256 recomputed from files[], which catches a
        #              CONSISTENTLY edited files[] that layer 1 would accept
        #   SIGNATURE  Ed25519 over manifest_hash()
        #
        # --expect-absent names the two categories of recorded file this
        # repository deliberately does not contain: the seven held-out vector
        # files (rule 1 / R3, scoring-only and CI-only) and the vector
        # generator (rule 6, generator + seed regenerate the held-out set).
        # Both are in .gitignore for those reasons. They are reported as
        # DECLARED ABSENT and are never counted as verified -- an unavailable
        # file is not a checked one (R1) -- and their contents are not read.
        # Measured on this ledger: 29 recorded, 21 verified here, 8 declared
        # absent, 0 hash mismatches, 0 unrecorded files on disk.
        #
        # --key-fingerprint pins the signer. Without it the signature layer
        # verifies with the public key EMBEDDED IN THE MANIFEST, which proves
        # self-consistency but not authorship: a forged manifest re-signed with
        # an attacker's own key passes. The pin makes editing this workflow a
        # visible precondition of that attack.
        run: |
          python3 tools/verify_manifest.py \
            --ledger bench/LEDGER_relian-bench-v1.2.json \
            --root bench \
            --include-dirs corpus,harness \
            --include-files SPEC.md \
            --expect-absent '**/vectors/heldout.jsonl,harness/gen_vectors.py' \
            --key-fingerprint 233bb4406e2de606

      - name: Verify discovery-bench/ against its ledger
        # WP-2.1. RELIAN-DISCOVERY-BENCH v0.1 is sealed by the OPERATOR in a
        # key session (R4); nothing in this repository signs. Until that
        # happens there is no ledger to check.
        #
        # CHOICE MADE, STATED PLAINLY: this step is GATED ON THE FILE'S
        # EXISTENCE and skips with a named reason, rather than being commented
        # out with a TODO. Both were offered; existence-gating wins because a
        # commented-out step is invisible in the checks list, whereas this one
        # appears on every run and says which of the two states it is in. The
        # moment the operator commits the ledger, the same step starts
        # enforcing with no workflow edit -- so the gate cannot be forgotten,
        # and turning it on cannot be the thing somebody forgets to do.
        #
        # TODO(WP-2.1-seal): after the ceremony, replace the `if` with an
        # unconditional run so a DELETED ledger fails instead of skipping.
        # Until the ledger exists, that inversion would fail every run.
        #
        # --from-manifest reads include_rules and expected_absent out of the
        # SIGNED payload, so the include set and the declared absences are the
        # signer's claim rather than this workflow's. That is the difference
        # from the v1.2 step above, which has to be told the rules because the
        # v1.2 format does not record them.
        #
        # Gate 5: verified must equal recorded and declared_absent must be 0.
        # A layout oracle has no held-out split -- the ground truth IS the
        # answer key -- so anything less means the seal covers something the
        # public repo cannot check, and the seal is wrong.
        run: |
          LEDGER=discovery-bench/LEDGER_relian-discovery-bench-v0.1.json
          if [ ! -f "$LEDGER" ]; then
            echo "FAIL: $LEDGER is missing."
            echo "RELIAN-DISCOVERY-BENCH v0.1 was sealed 2026-08-21 and tagged"
            echo "relian-discovery-bench-v0.1. An absent ledger means the seal"
            echo "was deleted, not that it is pending."
            exit 1
          fi
          echo "--- ledger present; verifying ---"
          python3 tools/verify_manifest.py \
            --ledger "$LEDGER" \
            --from-manifest \
            --pin-fingerprint 233bb4406e2de606 \
            --json > discovery-verify.json
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path("discovery-verify.json").read_text())
          tree = next(l for l in report["layers"] if l["name"] == "tree")
          detail = tree["detail"]
          print(json.dumps(detail, indent=2, sort_keys=True)[:2000])
          problems = []
          if not report["ok"]:
              problems.append(f"layers failed: {[l['name'] for l in report['layers'] if not l['ok']]}")
          if detail["declared_absent"] != 0:
              problems.append(
                  f"declared_absent is {detail['declared_absent']}, expected 0. "
                  f"The discovery bench has no held-out split; an unverifiable "
                  f"file inside the seal means the seal is wrong. Escalate "
                  f"rather than declare."
              )
          if detail["verified"] != detail["recorded"]:
              problems.append(
                  f"verified {detail['verified']} != recorded "
                  f"{detail['recorded']}; the seal covers something this "
                  f"perimeter cannot check"
              )
          if problems:
              for problem in problems:
                  print(f"GATE FAILED: {problem}")
              sys.exit(1)
          print(f"GATE MET: {detail['verified']}/{detail['recorded']} verified, "
                f"0 declared absent, 0 mismatches, signer pinned.")
          PY

      - name: Confirm nothing under bench/ was modified
        # Rule 4: bench/ is not editable by an agent or by CI. The suite's
        # mutation tests all run against a tmp_path copy, so the working tree
        # must be byte-clean here. If it is not, something wrote to the sealed
        # corpus during this job and the verification above described a tree
        # that no longer exists.
        if: always()
        run: |
          echo "--- git status --short -- bench/ ---"
          git status --short -- bench/
          test -z "$(git status --porcelain -- bench/)" \
            || { echo "FAIL: bench/ was modified during this run"; exit 1; }

  oracle-regen:
    # WP-2.1 -- discovery-bench/oracle/oracle.json is GENERATED GROUND TRUTH
    # that sits inside the seal (D7). Committed generated data is only
    # trustworthy if it can be shown to still match what generated it, so this
    # job regenerates it from the fifteen copybooks with the pinned `cobc` and
    # fails on any byte difference. Same pattern as parser-regen, and a
    # separate job for the same reason: a drifted answer key is a PROVENANCE
    # failure and should be legible as one in the checks list rather than as a
    # test failure.
    #
    # This is acceptance gate 2's clean-runner half. The local half -- byte
    # identity across two consecutive runs on the authoring machine -- is
    # asserted by tests/test_bench_oracle.py.
    #
    # If this goes red, do NOT edit the oracle to agree. Either something about
    # the toolchain changed (which the version assertion below should have
    # caught first) or the harness changed, and both are re-version events:
    # v0.2, new seal, new tag. Never a silent edit to the answer key.
    name: discovery oracle is byte-identical to a fresh regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Any toolchain skip becomes a failure. Green-by-skip is closed on day
      # one rather than discovered later: a runner that quietly lost `cobc`
      # would otherwise regenerate nothing and report success.
      RELIAN_REQUIRE_COBC: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Pin the interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the system toolchain
        # Unpinned by apt (T16), which is exactly why the next step asserts the
        # version rather than trusting it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol

      - name: Assert cobc matches the oracle's recorded toolchain
        # Acceptance gate 6. Every offset in oracle.json is THIS compiler's
        # byte layout; an oracle derived under a different one is a different
        # oracle, and it would fail the diff below with a confusing message
        # about JSON rather than a clear one about the compiler.
        #
        # Read from the oracle's own `toolchain.cobc`, and -- once the ledger
        # exists -- cross-checked against the SIGNED `oracle_toolchain.cobc`,
        # so the assertion is against what the signer attested to rather than
        # against a string in this workflow. The patch level is compared, not
        # just the major: `setup-java` pinning majors only has already produced
        # three observed javac patch levels (T4), and nothing pins cobc at all.
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          measured = subprocess.run(
              ["cobc", "--version"], capture_output=True, text=True, timeout=30
          ).stdout.splitlines()[0].strip()

          oracle = json.loads(
              Path("discovery-bench/oracle/oracle.json").read_text()
          )
          recorded = oracle["toolchain"]["cobc"]

          print(f"  runner cobc      : {measured}")
          print(f"  oracle toolchain : {recorded}")

          problems = []
          if measured != recorded:
              problems.append(
                  f"the runner's cobc is {measured!r} but the oracle was "
                  f"generated by {recorded!r}. Every offset in that file is "
                  f"one compiler's byte layout. Do not regenerate under a "
                  f"different compiler and call it the same oracle -- that is "
                  f"a v0.2 with a new seal and a new tag."
              )

          ledger = Path(
              "discovery-bench/LEDGER_relian-discovery-bench-v0.1.json"
          )
          if ledger.is_file():
              signed = json.loads(ledger.read_text())["oracle_toolchain"]["cobc"]
              print(f"  signed as        : {signed}")
              if signed != measured:
                  problems.append(
                      f"the SIGNED oracle_toolchain is {signed!r}, which the "
                      f"runner's {measured!r} does not match"
                  )
          else:
              print("  signed as        : (not sealed yet -- "
                    "TODO(WP-2.1-seal))")

          if problems:
              for problem in problems:
                  print(f"GATE FAILED: {problem}")
              sys.exit(1)
          print("GATE MET: runner cobc equals the oracle's recorded toolchain.")
          PY

      - name: Regenerate the oracle and diff byte-for-byte
        run: |
          python3 discovery-bench/harness/oracle_layouts.py --check

      - name: Confirm the regeneration wrote nothing into discovery-bench/
        # --check regenerates in memory. If the tree is dirty afterwards,
        # something wrote to the artifact during the job that verifies it.
        if: always()
        run: |
          echo "--- git status --short -- discovery-bench/ ---"
          git status --short -- discovery-bench/
          test -z "$(git status --porcelain -- discovery-bench/)" \
            || { echo "FAIL: discovery-bench/ was modified during this run"; exit 1; }

  ddl-loads:
    # WP-2.4 D33 -- the generated target-schema DDL is executed against a real
    # PostgreSQL, and then information_schema is asked whether PostgreSQL
    # agrees with what we said we generated.
    #
    # Both halves are needed and only the second is a measurement of the
    # mapping. Loading proves the DDL is syntactically valid and mutually
    # consistent; it says nothing about whether CHAR(30) is what we claimed to
    # emit. Querying information_schema proves PostgreSQL's own catalogue
    # matches the mapping table, column for column.
    #
    # THE SHORTCUT THIS JOB MUST NEVER TAKE: verifying the DDL by re-reading
    # the strings the generator produced. That is the WP-2.2 §0 circularity in
    # a new place -- the generator grading its own homework -- and it would
    # make this gate decorative while leaving it green. tools/ddl_load_check.py
    # therefore compares against `data_type`, `character_maximum_length`,
    # `numeric_precision` and `numeric_scale` as PostgreSQL reports them, and
    # never re-parses the emitted SQL.
    #
    # PROVEN TO BITE, not argued. Running the tool with the rendered DDL
    # sabotaged to execute CHAR(99) while continuing to claim CHAR(1) fails on
    # the reconciliation, naming all four affected columns:
    #
    #   GATE FAILED (reconcile): d09_conditions_d09_conditions.d09_status:
    #     claimed CHAR(1) (character_maximum_length=1), PostgreSQL reports
    #     character_maximum_length=99
    #
    # A separate job from `pytest` on purpose, and NOT a pytest test: a test
    # needing a live PostgreSQL would skip on every developer machine, drift
    # EXPECTED_SKIPS, and be green-by-skip here -- which is the failure mode
    # tests/toolchain.py exists to close.
    #
    # R12: the corpus is copybook SOURCE. No dataset is opened, nothing is
    # INSERTed. The schema is the deliverable; the data never leaves the
    # customer perimeter.
    name: generated DDL loads into postgres:16 and matches information_schema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relian
          POSTGRES_PASSWORD: relian
          POSTGRES_DB: relian_ddl
        ports:
          - 5432:5432
        # Without the health check the job races the container and fails on
        # connection refused, which reads as a DDL defect rather than a
        # scheduling one.
        #
        # The health command is EXACTLY the one proven green in run 44
        # (https://github.com/khaaliswooden-max/relian/actions/runs/32542445394).
        # It probes with no `-d`, so pg_isready connects to a database named
        # after the USER, which does not exist, and the service-container log
        # carries two `FATAL: database "relian" does not exist` lines on a job
        # that is passing. That is noise, not a fault: pg_isready reports
        # "accepting connections" because the server answered, which is the
        # only thing this check needs to establish.
        #
        # Adding `-d relian_ddl` would quiet those two lines and is very likely
        # correct, but it is UNVERIFIED here -- this container has no Docker
        # daemon, so it could not be exercised before being pushed at a gate.
        # A cosmetic change to a gate, shipped unmeasured, is the trade this
        # repository does not make. Left as it is, deliberately.
        #
        # NOTHING BUT DOCKER ARGUMENTS MAY GO INSIDE `options:`. It is a YAML
        # FOLDED scalar (`>-`), so every line below is joined with spaces and
        # handed to `docker create` verbatim -- a `#` comment in there is not a
        # comment, it is an argument. Measured: run 45 put these five comment
        # lines inside the block and `docker create` rejected the whole thing
        # with `invalid reference format` before the container ever started.
        # Hence the explanation lives out here.
        options: >-
          --health-cmd "pg_isready -U relian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        id: checkout

      - name: Pin the interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        # psycopg2-binary==2.9.12 is already in the fully-hashed lock file
        # (V10); nothing new is resolved here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Record the measured PostgreSQL version
        # R9: the version that produced the result, in the run log, so a green
        # tick is never separable from the conditions that earned it.
        env:
          PGPASSWORD: relian
        run: psql -h localhost -U relian -d relian_ddl -c "SELECT version();"

      - name: Execute the generated DDL and reconcile information_schema
        env:
          RELIAN_DDL_DSN: postgresql://relian:relian@localhost:5432/relian_ddl
        run: |
          python3 tools/ddl_load_check.py \
            --dsn "$RELIAN_DDL_DSN" \
            --corpus discovery-bench/corpus \
            --schema relian_ddl_check \
            --json ddl-load-report.json

      - name: Confirm nothing under discovery-bench/ was modified
        # Rule 4: the corpus is frozen. This job READS fifteen copybooks and
        # must write nothing back into the sealed tree.
        #
        # Conditioned on the checkout rather than on `always()` alone. When the
        # service container failed to start in run 45, checkout was skipped and
        # this step still ran, reporting `fatal: not a git repository` -- a
        # second, misleading error on top of the real one. The guard must fire
        # whenever there is a tree to check and stay quiet when there is not.
        if: always() && steps.checkout.outcome == 'success'

        run: |
          echo "--- git status --short -- discovery-bench/ ---"
          git status --short -- discovery-bench/
          test -z "$(git status --porcelain -- discovery-bench/)" \
            || { echo "FAIL: discovery-bench/ was modified during this run"; exit 1; }

      - name: Upload the reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddl-load-report
          path: ddl-load-report.json
          if-no-files-found: warn

  pytest:
    name: pytest (CPython 3.12, GnuCOBOL + JDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # WP-2.1. tests/test_bench_oracle.py guards its cobc-dependent tests with
      # a skipif so a developer without GnuCOBOL still gets the pure-JSON half
      # of the suite. That is honest locally and would be green-by-skip here,
      # so on the runner the guard is disarmed: with this set, a missing `cobc`
      # raises out of require_cobc() instead of skipping, and the job goes red.
      #
      # This also protects EXPECTED_SKIPS. The discovery oracle tests must
      # contribute ZERO skips on the runner; if they ever contributed some, the
      # skip-count assertion below would drift for a reason that has nothing to
      # do with the ten fixture-shape skips it exists to pin.
      RELIAN_REQUIRE_COBC: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Pin the interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the system toolchain
        # The suite is not pure Python: the demo tests compile COBOL with
        # `cobc` and Java with `javac`, run both, and diff the results. Without
        # both, thirteen demo tests skip and the assertion below fails, which is
        # the intended behaviour -- an unmeasured comparison is not a passed one.
        #
        # Only GnuCOBOL comes from apt. The JDK used to come from
        # `default-jdk-headless`, which is not a version at all: it resolves to
        # whatever the runner image currently calls default, and on
        # ubuntu-latest that was Java 17 while the operator baseline and the dev
        # container were both on 21. The session fixture caught the drift
        # (`javac_version: javac 17.0.20`, recorded in docs/PHASE2_LOG.md §10).
        # A differential-equivalence harness must not take its compiler from a
        # moving image label, so the JDK is pinned by the next step instead.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol

      - name: Pin the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Record the measured toolchain
        # R1/R9: the versions that produced the result, printed into the run log
        # so a green tick is never separable from the conditions that earned it.
        # `java-version: '21'` pins the MAJOR version only -- see the caveat in
        # docs/PHASE2_LOG.md §11 -- so the exact patch release is captured here.
        run: |
          python -VV
          cobc --version | head -1
          javac -version
          java -version

      - name: Install pinned dependencies
        # requirements.lock is fully hashed, so pip refuses any artifact whose
        # SHA-256 is not listed. The editable install that follows adds the
        # project itself; every name in [project.dependencies] and the `dev`
        # extra is already pinned above, so it resolves nothing new.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Record the resolved environment
        run: |
          pip check
          pip freeze | sort > pip-freeze.txt
          echo "pip freeze sha256: $(sha256sum pip-freeze.txt | cut -d' ' -f1)"
          cat pip-freeze.txt

      - name: pytest
        run: pytest -q -rs --junitxml=junit.xml

      - name: Assert the suite result is exactly the sealed triple
        # `if: always()` so a red suite still gets the count breakdown printed
        # rather than only pytest's own summary. It never converts a failure
        # into a pass -- the script exits nonzero on any failure, error, or
        # skip-count drift, and the pytest step above has already failed the
        # job in that case.
        if: always()
        run: |
          python3 - "$EXPECTED_SKIPS" "$EXPECTED_PASSES" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected_skips = int(sys.argv[1])
          expected_passes = int(sys.argv[2])
          report = Path("junit.xml")
          if not report.is_file():
              raise SystemExit(
                  "FAIL: junit.xml was not written -- pytest did not run to "
                  "completion, so there is no result to assert on. An absent "
                  "measurement is not a pass."
              )

          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          if not suites:
              raise SystemExit("FAIL: junit.xml contains no <testsuite> element")

          def total(attr):
              return sum(int(s.get(attr, 0)) for s in suites)

          tests, failures = total("tests"), total("failures")
          errors, skipped = total("errors"), total("skipped")
          passed = tests - failures - errors - skipped

          # The toolchain the run actually measured, recorded by the
          # session-scoped fixture in tests/conftest.py.
          print("--- measured environment ---")
          for suite in suites:
              for prop in suite.iterfind("properties/property"):
                  print(f"  {prop.get('name')}: {prop.get('value')}")

          print("--- result ---")
          print(f"  {passed} passed, {skipped} skipped, "
                f"{failures} failed, {errors} errored")

          problems = []
          if failures or errors:
              problems.append(f"{failures} failure(s) and {errors} error(s); "
                              f"the gate requires 0 of each")
          if skipped != expected_skips:
              print("--- skips in this run ---")
              for suite in suites:
                  for case in suite.iter("testcase"):
                      for skip in case.iterfind("skipped"):
                          print(f"  {case.get('classname')}::{case.get('name')}"
                                f" -- {skip.get('message')}")
              problems.append(
                  f"skip count drifted: {skipped}, expected {expected_skips}. "
                  f"MORE skips usually means the runner lost `cobc` or `javac` "
                  f"and the demo tests guarded themselves off -- that is an "
                  f"unmeasured comparison, not a passing one. FEWER means a "
                  f"conditional skip became unconditional. Either way, "
                  f"reconcile against docs/PHASE2_LOG.md and update "
                  f"EXPECTED_SKIPS in this workflow deliberately."
              )
          if passed != expected_passes:
              problems.append(
                  f"pass count drifted: {passed}, expected {expected_passes}. "
                  f"FEWER passes usually means a test STOPPED BEING COLLECTED "
                  f"-- a renamed file that no longer matches `python_files`, an "
                  f"ImportError absorbed at collection, a parametrisation that "
                  f"stopped expanding -- which lowers this number while leaving "
                  f"skips and failures untouched, and is exactly the drift this "
                  f"assertion exists to catch. MORE passes means tests were "
                  f"added. Either way, reconcile against docs/PHASE2_LOG.md and "
                  f"update EXPECTED_PASSES in this workflow deliberately, "
                  f"attributing the delta test by test."
              )
          if passed <= 0:
              problems.append("no test passed; refusing to certify an empty run")

          if problems:
              for problem in problems:
                  print(f"GATE FAILED: {problem}")
              raise SystemExit(1)

          print(f"GATE MET: {passed} passed (expected {expected_passes}), "
                f"{skipped} skipped (expected {expected_skips}), "
                f"0 failed, 0 errored")
          PY

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: |
            junit.xml
            pip-freeze.txt
          # An earlier step can fail before pytest writes anything; warn rather
          # than masking that failure with a second one here.
          if-no-files-found: warn
