name: RELIAN-BENCH scoring
on: [push, pull_request]
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y gnucobol default-jdk-headless
      - name: Verify committed ledger signature
        run: |
          pip install cryptography -q
          python3 - <<'PY'
          import json, sys; sys.path.insert(0,'bench')
          from harness.commit import verify
          m = json.load(open('bench/LEDGER_relian-bench-v1.2.json'))
          assert verify(m), 'LEDGER signature invalid — benchmark tampered'
          print('ledger verified:', m['signature']['manifest_sha256'][:16])
          PY
      - name: Fetch PRIVATE held-out vectors (deploy key)
        env:
          BENCH_DEPLOY_KEY: ${{ secrets.RELIAN_BENCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$BENCH_DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:khaaliswooden-max/relian-bench-private.git /tmp/bench-private
          for d in /tmp/bench-private/corpus/P*/; do
            n=$(basename $d)
            cp $d/vectors/heldout.jsonl bench/corpus/$n/vectors/
          done
      - name: Build oracles
        run: for d in bench/corpus/P*/; do (cd $d && cobc -x program.cbl -o oracle); done
      - name: Generate candidate from the transpiler under test
        run: |
          python3 - <<'PY'
          # The scoring step used to look for candidates/current "populated by
          # the pipeline under test". Nothing ever populated it, so the early
          # exit was taken on every run and the held-out split was never
          # scored. This step is what populates it: the transpiler at this
          # commit, run over the committed corpus. It reads no vectors.
          import json, re
          from pathlib import Path
          from transpiler.c1_rulebased import Transpiler

          def failure_stub(cls: str, exc: Exception) -> str:
              """Java that does not compile, so a transpile failure is visible.

              A comment-only .java file is a legal empty compilation unit and
              javac exits 0 on it, which would leave build_ok true and
              build_rate 1.0 for a program that produced nothing runnable. The
              stub therefore references an unresolved type whose NAME states the
              reason, so `javac` fails with 'cannot find symbol
              RELIAN_TRANSPILE_FAILED' and build_rate reflects reality.

              The message is flattened to one line and '/' is replaced, because
              a newline would spill out of the // comment and a path could
              collide with the harness's anti-gaming token list, turning a
              build failure into a misreported 'gaming controls tripped'.
              """
              msg = re.sub(r'\s+', ' ', f'{type(exc).__name__}: {exc}').replace('/', '|')
              return (f'// TRANSPILE FAILED: {msg[:300]}\n'
                      f'// Deliberately uncompilable: see failure_stub in bench.yml.\n'
                      f'public class {cls} {{\n'
                      f'    public static void main(String[] args) {{\n'
                      f'        RELIAN_TRANSPILE_FAILED unresolved = null;\n'
                      f'    }}\n'
                      f'}}\n')

          mains = json.loads(Path('bench/harness/mains.json').read_text())
          failed = []
          for prog, cls in sorted(mains.items()):
              src = Path(f'bench/corpus/{prog}/program.cbl').read_text()
              dest = Path('candidates/current') / prog
              dest.mkdir(parents=True, exist_ok=True)
              try:
                  java = Transpiler(src, cls).transpile()
              except Exception as exc:
                  # Honest failure (R2): emit a failure the scorer can see.
                  # Omitting the program would shrink the denominator and
                  # inflate BER; emitting something that compiles would hide it
                  # from build_rate. Neither is acceptable.
                  java = failure_stub(cls, exc)
                  failed.append(f'{prog}: {type(exc).__name__}: {exc}')
                  print(f'{prog}: TRANSPILE FAILED: {type(exc).__name__}: {exc}')
              (dest / f'{cls}.java').write_text(java)
              print(f'{prog}: emitted {len(java)} bytes -> {dest / f"{cls}.java"}')

          if failed:
              print(f'{len(failed)} of {len(mains)} program(s) did not transpile; '
                    f'they will fail to compile and score 0 over their full vector count')
          PY
      - name: Score candidate on HELD-OUT split
        run: |
          python3 - <<'PY'
          import json, os, sys; sys.path.insert(0,'bench')
          from harness.runner import run_candidate
          from pathlib import Path

          ledger = json.load(open('bench/LEDGER_relian-bench-v1.2.json'))
          thresholds = ledger['thresholds']
          mains = json.loads(Path('bench/harness/mains.json').read_text())
          out = Path('candidates/current')

          # WP-1.5.0c: the machine-readable summary the WP-1.5.0 contract
          # asked for. Written on EVERY path -- red runs carry the evidence
          # of what was (not) measured, which is the point of the artifact.
          summary = {
              'n_vectors': 0,
              'ber': None,
              'build_rate': None,
              'branch_coverage': None,
              'coverage_tool': None,
              'git_sha': os.environ.get('GITHUB_SHA', 'unknown'),
              'ledger_ref': {
                  'tag': ledger.get('tag'),
                  'manifest_sha256': ledger['signature']['manifest_sha256'],
              },
              'failures': [],
          }

          def emit_summary():
              Path('bench_summary.json').write_text(
                  json.dumps(summary, indent=2) + '\n')
              print('--- bench_summary.json ---')
              print(json.dumps(summary, indent=2))

          # A gate that cannot measure must FAIL, never pass. Exiting 0 here is
          # how this job stayed green for every commit while scoring nothing.
          if not out.exists():
              summary['failures'] = ['no candidate at candidates/current']
              emit_summary()
              raise SystemExit('FAIL: no candidate at candidates/current — '
                               'the gate cannot score, so it must not pass')

          try:
              rep = run_candidate('current', out, mains, split='heldout')
          except Exception as exc:
              summary['failures'] = [f'scoring raised {type(exc).__name__}: {exc}']
              emit_summary()
              raise SystemExit(f'FAIL: held-out not scored — refusing to '
                               f'certify ({type(exc).__name__}: {exc})')

          # Vectors actually compared by the scorer. On the happy path this is
          # the whole held-out split (the ledger records 60 per program = 300);
          # a program that failed to build contributes 0 here, so a gate that
          # compiled nothing cannot report having scored anything.
          n_vectors = sum(s.vectors_total or 0 for s in rep.scores)
          summary.update({
              'n_vectors': n_vectors,
              'ber': rep.ber_overall,
              'build_rate': rep.build_rate,
              'branch_coverage': rep.coverage_branch,
              'coverage_tool': rep.coverage_tool,
          })
          print(json.dumps({'ber': rep.ber_overall, 'build_rate': rep.build_rate,
                            'branch_coverage': rep.coverage_branch,
                            'coverage_tool': rep.coverage_tool,
                            'valid': rep.valid, 'reason': rep.invalid_reason}, indent=2))

          # Per-program detail, printed BEFORE the verdict so a red gate is
          # diagnosable from the same log rather than needing a re-run.
          print('--- per program ---')
          for s in rep.scores:
              d = s.coverage_detail or {}
              branches = (f'{d.get("branches_covered")}/{d.get("branches_total")}'
                          if d.get('branches_total') is not None else 'n/a')
              print(f'  {s.program}: build_ok={s.build_ok} ber={s.ber} '
                    f'branch={s.coverage_branch} ({branches})'
                    + (f' note={d["note"]}' if d.get('note') else ''))

          failures = []
          # WP-1.5.0c: the explicit contract check. Zero vectors compared
          # means nothing was certified, whatever the other fields claim.
          if n_vectors == 0:
              failures.append('held-out not scored — refusing to certify '
                              '(n_vectors == 0)')
          if not rep.valid:
              failures.append(f'run INVALID: {rep.invalid_reason}')
          if rep.ber_overall is None:
              failures.append('BER not measured (null) — unmeasured is not a pass')
          elif rep.ber_overall < thresholds['ber_heldout_min']:
              failures.append(f'BER {rep.ber_overall} < {thresholds["ber_heldout_min"]}')
          if rep.build_rate is None:
              failures.append('build_rate not measured (null)')
          elif rep.build_rate < thresholds['build_rate_min']:
              failures.append(f'build_rate {rep.build_rate} < {thresholds["build_rate_min"]}')

          # Branch coverage. The threshold is the ledger's single aggregate
          # figure, so this gates the branch-weighted aggregate and prints the
          # per-program breakdown above rather than inventing a per-program
          # threshold the ledger does not define.
          #
          # None fails, and that is load-bearing rather than pedantic: the
          # harness reports None when a candidate has ZERO branches, precisely
          # so that straight-line placeholder code cannot dodge the metric by
          # having nothing to cover. 0/0 is undefined, not 100%.
          if rep.coverage_branch is None:
              notes = sorted({s.coverage_detail['note'] for s in rep.scores
                              if (s.coverage_detail or {}).get('note')})
              failures.append(
                  'branch coverage not measured (null) — unmeasured is not a pass'
                  + (f'; {" | ".join(notes)}' if notes else ''))
          elif rep.coverage_branch < thresholds['branch_coverage_min']:
              failures.append(
                  f'branch_coverage {rep.coverage_branch} < '
                  f'{thresholds["branch_coverage_min"]}')

          summary['failures'] = failures
          emit_summary()

          if failures:
              for f in failures:
                  print(f'THRESHOLD FAILED: {f}')
              raise SystemExit(1)

          print(f'THRESHOLD MET: n_vectors {n_vectors}, '
                f'BER {rep.ber_overall} >= {thresholds["ber_heldout_min"]}, '
                f'build_rate {rep.build_rate} >= {thresholds["build_rate_min"]}, '
                f'branch_coverage {rep.coverage_branch} >= '
                f'{thresholds["branch_coverage_min"]} ({rep.coverage_tool})')
          PY
      - name: Upload bench_summary.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench_summary
          path: bench_summary.json
          # Steps before scoring can fail (fetch, oracles) with no summary
          # written; warn rather than masking that earlier failure with a
          # second one here.
          if-no-files-found: warn
